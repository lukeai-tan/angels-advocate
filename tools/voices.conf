# voices.conf — maps <language>_<speaker> to a Piper .onnx voice model.
#
# speak.sh reads this. Format:  <lang>_<speaker>=<model-path>
# lang    : en | de | zh | ja   (matches the <!-- speak:xx --> tag Claude emits)
# speaker : angel | devil | arbiter | verifier
#
# Point each value at a Piper model file you downloaded (see README_tts.md).
# Piper needs BOTH the .onnx and its .onnx.json sitting next to each other; you
# reference the .onnx here and Piper finds the .json automatically.
#
# Pick contrasting voices per language so the speakers are distinguishable:
#   angel    -> brighter / softer
#   devil    -> lower / rougher
#   arbiter  -> neutral / narrator
#   verifier -> crisp / matter-of-fact (the ✅ conformance pass)
#
# If you only have three distinct models, point verifier at the arbiter's — it
# reads the closing ✅ line, so sharing the narrator voice is a fine default.
#
# Edit MODELS_DIR to wherever you unpacked the models.

MODELS_DIR="$HOME/piper/models"

# --- English ---
en_angel="$MODELS_DIR/en_US-amy-medium.onnx"
en_devil="$MODELS_DIR/en_US-ryan-high.onnx"
en_arbiter="$MODELS_DIR/en_US-lessac-medium.onnx"
en_verifier="$MODELS_DIR/en_US-hfc_female-medium.onnx"

# --- German (Piper's German models are strong; Thorsten is the standout) ---
de_angel="$MODELS_DIR/de_DE-eva_k-x_low.onnx"
de_devil="$MODELS_DIR/de_DE-thorsten-medium.onnx"
de_arbiter="$MODELS_DIR/de_DE-karlsson-low.onnx"
de_verifier="$MODELS_DIR/de_DE-karlsson-low.onnx"

# --- Chinese (fewer distinct zh voices exist; reuse one if you only grab one) ---
zh_angel="$MODELS_DIR/zh_CN-huayan-medium.onnx"
zh_devil="$MODELS_DIR/zh_CN-huayan-medium.onnx"
zh_arbiter="$MODELS_DIR/zh_CN-huayan-medium.onnx"
zh_verifier="$MODELS_DIR/zh_CN-huayan-medium.onnx"

# --- Japanese ---
ja_angel="$MODELS_DIR/ja_JP-test-medium.onnx"
ja_devil="$MODELS_DIR/ja_JP-test-medium.onnx"
ja_arbiter="$MODELS_DIR/ja_JP-test-medium.onnx"
ja_verifier="$MODELS_DIR/ja_JP-test-medium.onnx"
